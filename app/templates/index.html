{% extends "base.html" %}
{% block title %}Galaxy Motors — Find Your Car{% endblock %}

{% block content %}

<!-- Hero -->
<section class="hero text-white text-center">
  <div class="container">
    <h1 class="display-5 fw-bold">Find Your Perfect Vehicle</h1>
    <p class="lead">Browse our full inventory of new and pre-owned vehicles.</p>
  </div>
</section>

<!-- Search Filter -->
<section class="container my-4">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h6 class="text-uppercase text-muted fw-semibold mb-3 small">Filter Inventory</h6>
      <form method="get" action="/search">
        <div class="row g-3 align-items-end">

          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold">Condition</label>
            <select name="condition" id="conditionSelect" class="form-select form-select-sm">
              <option value="">Any</option>
              <option value="new">New</option>
              <option value="used">Used</option>
            </select>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold">Make</label>
            <select name="make" id="makeSelect" class="form-select form-select-sm"></select>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold">Model</label>
            <select name="model" id="modelSelect" class="form-select form-select-sm"></select>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold">Year</label>
            <select name="year" id="yearSelect" class="form-select form-select-sm"></select>
          </div>

          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold">Price</label>
            <select name="price_range" class="form-select form-select-sm">
              <option value="">Any</option>
              <option value="under_10000">Under $10,000</option>
              <option value="under_20000">Under $20,000</option>
              <option value="under_30000">Under $30,000</option>
              <option value="under_50000">Under $50,000</option>
              <option value="under_60000">Under $60,000</option>
              <option value="over_60000">Over $60,000</option>
            </select>
          </div>

          <div class="col-6 col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-danger btn-sm w-100">Search</button>
          </div>

        </div>
      </form>
    </div>
  </div>
</section>

<script>
const filterData = {{ filter_data_json | safe }};
const currentFilters = { condition: "", make: "", model: "", year: "" };
</script>
<script src="/static/js/filters.js"></script>

{% endblock %}
